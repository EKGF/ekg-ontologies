name: Publish ontology reference
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ontology-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify publication build orchestration
        run: python3 -B -m unittest discover -s tests -p test_grapharch_build.py
      - name: Install the GraphArch release of the pinned action
        id: grapharch
        uses: EKGF/grapharch@eb358c6553ef377158d5523bddda9378f1481d1a # v0.2.9
        with:
          mode: install
      - name: Build and package the EKGF ontology family website
        env:
          GRAPHARCH_BINARY: ${{ steps.grapharch.outputs.binary-path }}
          GRAPHARCH_EDITION: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'default' }}
        run: >-
          python3 -B scripts/build_grapharch_pages.py
          --grapharch "$GRAPHARCH_BINARY"
          --edition "$GRAPHARCH_EDITION"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site/pages/static
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: reference
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
