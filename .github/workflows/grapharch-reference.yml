name: Build ontology reference
on:
  workflow_dispatch:
    inputs:
      grapharch-version:
        description: Exact verified GraphArch release version (without v); run after release publication
        required: true
        type: string
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build HTML, PDF and documentation KG
        id: grapharch
        uses: EKGF/grapharch@3dd1d4b21ff897b5761f2ee1e31e10ec97f3e9c8
        with:
          version: ${{ inputs.grapharch-version }}
          source-kind: checkout
          source: .
          definitions: publication/grapharch.ttl
          project: urn:ekgf-ontologies:documentation:project
          target: urn:ekgf-ontologies:documentation:specification
          output: _site
      - name: Upload generated reference and restorable KG
        uses: actions/upload-artifact@v4
        with:
          name: ekgf-ontology-reference
          if-no-files-found: error
          path: |
            ${{ steps.grapharch.outputs.publication-path }}
            ${{ steps.grapharch.outputs.kg-path }}
