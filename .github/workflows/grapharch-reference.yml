name: Publish ontology reference
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ontology-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify publication build orchestration
        run: python3 -B -m unittest discover -s tests -p test_grapharch_build.py
      - name: Install GraphArch v0.2.8
        id: grapharch
        uses: EKGF/grapharch@595e55913096cb7f39633189ef67f5d916ef4dcc
        with:
          version: '0.2.8'
          expected-revision: '595e55913096cb7f39633189ef67f5d916ef4dcc'
          mode: install
      - name: Build and package the EKGF ontology family website
        env:
          GRAPHARCH_BINARY: ${{ steps.grapharch.outputs.binary-path }}
        run: >-
          python3 -B scripts/build_grapharch_pages.py
          --grapharch "$GRAPHARCH_BINARY"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site/pages/.vercel/output/static
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: reference
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
